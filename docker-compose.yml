services:
  db:
    image: postgres:16
    container_name: stagelink_internships_db
    environment:
      POSTGRES_DB: internship_db
      POSTGRES_USER: staglink
      POSTGRES_PASSWORD: changeme
    ports:
      - "5433:5432"
    volumes:
      - stagelink_internships_pgdata:/var/lib/postgresql/data

volumes:
  stagelink_internships_pgdata:
